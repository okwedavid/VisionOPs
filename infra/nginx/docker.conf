# VisionOps web console server block for the Docker Compose stack.
#
# HTTP only: TLS terminates at the platform edge (or a separate proxy). The
# production host-install variant with certbot-managed TLS is
# `infra/nginx/visionops.conf`. Both proxy `/api` and the `/ws` upgrade to the
# backend so the app is same-origin in every deployment.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream visionops_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match VISIONOPS_MAX_BODY_BYTES (1 MiB) by default.
    client_max_body_size 1m;

    # Security headers (HSTS belongs on the TLS terminator).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://visionops_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
