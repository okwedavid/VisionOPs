# VisionOps production nginx site (host install, TLS via certbot).
#
# Install:
#   sudo cp -r frontend/dist /var/www/visionops
#   sudo cp infra/nginx/visionops.conf /etc/nginx/sites-available/visionops
#   sudo ln -s /etc/nginx/sites-available/visionops /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d visionops.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# The backend is expected on 127.0.0.1:8000. Because this file is included from
# the http context, `map` and `limit_req_zone` are valid here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting on the API. Auth failures are additionally limited *inside* the
# app per key/IP; this is the cheap outer bound.
limit_req_zone $binary_remote_addr zone=visionops_api:10m rate=20r/s;

upstream visionops_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name visionops.example.com;

    # certbot injects the ACME challenge location and the HTTPS redirect here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name visionops.example.com;

    # Managed by certbot.
    ssl_certificate     /etc/letsencrypt/live/visionops.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visionops.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/visionops;
    index index.html;

    # Match VISIONOPS_MAX_BODY_BYTES.
    client_max_body_size 1m;

    # HSTS. Confirm max-age with the customer before enabling preload.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        limit_req zone=visionops_api burst=40 nodelay;
        proxy_pass http://visionops_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Only trusted because VISIONOPS_TRUSTED_PROXIES is configured.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # Long-lived detection streams.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
