name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "true"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests, wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev
      # PRD §48 order: lint → format check → types → tests (coverage gate) → wheel.
      - run: make lint
      - run: make typecheck
      - run: make test-cov
      - run: make build-wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test:coverage
      - run: npm --prefix frontend run build

  e2e:
    name: End-to-end (real stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev
      - run: npm ci --prefix frontend
      # The Playwright global setup starts the real `visionops serve` and serves
      # the built SPA from frontend/dist, so the bundle must exist first.
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run test:e2e:install
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  security:
    name: Security (audit, secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev
      - run: npm ci --prefix frontend
      - run: make audit
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose

  model:
    name: Real-model smoke tests (opt-in)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev
      # Weights are never committed; cache them between runs and fetch on miss.
      - uses: actions/cache@v4
        with:
          path: models
          key: visionops-model-${{ runner.os }}-yolo11n
      - run: make model
      - run: make test-model
